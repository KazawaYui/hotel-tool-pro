name: Kiểm thử

# Chạy bộ test nghiệp vụ trên mỗi lần push và mỗi pull request.
# Bộ test này canh các lỗi từng làm sai hồ sơ nộp công an (mã quốc tịch,
# quy đổi tỷ giá, chia giá phòng connecting) nên phải chạy tự động, không
# trông vào việc nhớ chạy tay.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Chạy test
        run: python -m pytest -v

      - name: Kiểm tra app dựng được (không chỉ test lẻ)
        # Bắt các lỗi chỉ lộ ra khi nạp thật: thiếu import, sai đường dẫn
        # asset, hỏng cú pháp config.toml.
        run: |
          python -c "
          import hotel_core
          print('nạp logic nghiệp vụ OK —', len(hotel_core.__all__), 'hàm/bảng')
          "
          python -m py_compile app.py
          python -c "
          from streamlit import config
          config.get_config_options()
          assert config.get_option('server.enableStaticServing'), \
              'static serving bị tắt — ảnh nền sẽ không hiện'
          print('config.toml hợp lệ, static serving đang bật')
          "

      - name: Kiểm tra file ảnh nền còn đủ
        # CSS trỏ tới app/static/bg_*.jpg — thiếu file thì nền biến mất mà
        # không có lỗi nào báo.
        run: |
          python -c "
          import os
          thieu = [n for n in ('bg_dark', 'bg_light', 'bg_spring', 'bg_autumn',
                               'bg_winter', 'bg_tet', 'bg_noel')
                   if not os.path.exists(f'static/{n}.jpg')]
          assert not thieu, f'thiếu ảnh nền: {thieu}'
          print('đủ 7 ảnh nền trong static/')
          "
