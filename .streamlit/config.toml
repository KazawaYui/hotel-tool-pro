# Bảng màu đồng bộ với lớp giao diện Neumorphism tiêm trong app.py
# (--neu-bg #E6E9EF, --neu-accent #6C7CE0, --neu-text #3D4451) — tránh
# "nháy" nền trắng lúc tải và widget nền trắng chọi với nền xám.
[theme]
base = "light"
primaryColor = "#6C7CE0"
backgroundColor = "#E6E9EF"
secondaryBackgroundColor = "#EDF0F5"
textColor = "#3D4451"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "1rem"
borderColor = "#D5DAE4"
showWidgetBorder = false
sidebarBackgroundColor = "#E6E9EF"
skeletonBackgroundColor = "#DDE2EA"

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 100
